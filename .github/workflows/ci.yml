name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Spring Boot 3.x lines. Verifies the compileOnly dependencies resolve against each BOM.
        boot: ["3.2.12", "3.3.7", "3.4.5", "3.5.3"]
    name: build (Boot ${{ matrix.boot }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon -PspringBootVersion=${{ matrix.boot }}
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-boot-${{ matrix.boot }}
          path: build/reports/tests/test
