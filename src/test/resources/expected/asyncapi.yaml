          type: string
  /topic/scoreboard:
    address: /topic/scoreboard
    messages:
      GameState:
        $ref: '#/components/messages/GameState'
  /topic/scoreboard/{gameId}:
    address: /topic/scoreboard/{gameId}
    messages:
